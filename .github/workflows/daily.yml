name: daily

on:
  # 06:30 America/Los_Angeles -- the owner's timezone, which is NOT the timezone of the
  # machine this was authored on. GitHub cron is UTC-only with no notion of DST, so
  # 13:30 UTC = 06:30 PDT in summer and 05:30 PST in winter. Drifting earlier in winter
  # is deliberate -- a morning digest that arrives early is fine, one that arrives at
  # 07:30 is not.
  #
  # Three ticks, not one. Spec section 10.3 says scheduled runs are best-effort, and
  # that is understated: GitHub does not merely delay a cron tick under load, it drops
  # it, and a dropped tick on the single-tick schedule was a silently missed day. Each
  # later tick is a retry, and the run is idempotent -- the snapshots advance on the
  # first success so a retry sees a quiet day, and check.py suppresses a repeat Monday
  # heartbeat via data/last_delivered.txt. So the cost of a redundant tick is one
  # 30-second no-op run, and the benefit is that all three have to fail to lose a day.
  #
  # The ladder also covers the winter DST shift: 14:30 UTC is exactly 06:30 PST.
  schedule:
    - cron: "30 13 * * *" # 06:30 PDT / 05:30 PST
    - cron: "30 14 * * *" # 07:30 PDT / 06:30 PST -- retry
    - cron: "30 15 * * *" # 08:30 PDT / 07:30 PST -- last retry
  workflow_dispatch:

permissions:
  contents: write # commit state back: git is the database
  issues: write # deliver the digest

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check sources and deliver the digest
        env:
          # Fine-grained, read-only, public repos. Lifts the GitHub API limit from 60
          # requests/hour to 5,000.
          GH_PAT: ${{ secrets.GH_PAT }}
          # Optional. Without it the run still works; changes are surfaced unclassified
          # rather than dropped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check.py

      # The xlsx is rebuilt only when the CSVs actually changed. openpyxl output is not
      # byte-stable (zip timestamps), so rebuilding it unconditionally would put a
      # binary diff in every single commit and bury the line-level CSV history that is
      # the whole reason state lives in this repo.
      - name: Commit state
        run: |
          git config user.name "opportunity-tracker"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            python build_xlsx.py
            git add out
            # Timestamps advance on every run, so a commit happens daily whether or not
            # anything upstream moved. The snapshots change only on real content
            # changes, which makes them a precise discriminator -- so say which kind of
            # commit this is and keep `git log` scannable for change days.
            if git diff --cached --quiet -- data/snapshots; then
              git commit -q -m "state: heartbeat $(date -u +%Y-%m-%d) (no upstream changes)"
            else
              git commit -q -m "state: $(date -u +%Y-%m-%d) upstream changes detected"
            fi
            git push
          fi
